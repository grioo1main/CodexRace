services:
  postgres:
    image: postgres:16
    container_name: pvp-platform-db
    environment:
      POSTGRES_DB: pvp_platform
      POSTGRES_USER: pvp_user
      POSTGRES_PASSWORD: pvp_pass
    ports:
      - "5435:5432"
    volumes:
      - pvp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvp_user -d pvp_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pvp_pg_data: